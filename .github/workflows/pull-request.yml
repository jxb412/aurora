name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows x64
            target: win
            arch: x64
          - runner: macos-15
            platform: macOS arm64
            target: mac
            arch: arm64
          - runner: macos-15-intel
            platform: macOS x64
            target: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: node scripts/test-core-all.mjs
      - run: pnpm build
      - run: node scripts/test-desktop-shell.mjs
      - name: Package isolated application for acceptance
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --dir --publish never
      - name: Verify native configuration apply and restore
        run: python -c "import pathlib,subprocess,sys; root=pathlib.Path('release'); exe=root/'win-unpacked'/'YunQiaoAI.exe' if sys.platform=='win32' else next(root.glob('**/*.app/Contents/MacOS/YunQiaoAI')); subprocess.run([sys.executable,'scripts/test-packaged.py','--exe',str(exe)],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-validation-${{ matrix.target }}-${{ matrix.arch }}
          path: docs/PACKAGED-VALIDATION-*.json
          if-no-files-found: error
      - name: Build verified macOS installers
        if: matrix.target == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python -c "import pathlib,subprocess; app=next(pathlib.Path('release').glob('**/*.app')); subprocess.run(['npx','electron-builder','--mac','dmg','zip','--${{ matrix.arch }}','--prepackaged',str(app),'--publish','never'],check=True)"
      - name: Hash macOS installers
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'mac'
        with:
          name: yunqiao-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
